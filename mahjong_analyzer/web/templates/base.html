<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mahjong-analyzer{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f8;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #eef1ff 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #eafbf4 0%, transparent 50%);
    --card: #ffffff;
    --card-border: rgba(15, 23, 42, 0.08);
    --text: #16182b;
    --muted: #6b7086;
    --muted-2: #9498ab;
    --accent: #5b5cf0;
    --accent-2: #17c9b6;
    --accent-soft: rgba(91, 92, 240, 0.10);
    --good: #16a35e;
    --good-soft: rgba(22, 163, 94, 0.12);
    --bad: #e34a5e;
    --bad-soft: rgba(227, 74, 94, 0.12);
    --warn: #d68d16;
    --warn-soft: rgba(214, 141, 22, 0.12);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .16);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f16;
      --bg-grad: radial-gradient(1200px 600px at 10% -10%, rgba(91,92,240,.16) 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, rgba(23,201,182,.12) 0%, transparent 50%);
      --card: #171923;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #eef0fb;
      --muted: #a2a6c2;
      --muted-2: #6f7390;
      --accent: #8385ff;
      --accent-2: #2fe0c9;
      --accent-soft: rgba(131, 133, 255, 0.16);
      --good: #35d284;
      --good-soft: rgba(53, 210, 132, 0.14);
      --bad: #ff6b7f;
      --bad-soft: rgba(255, 107, 127, 0.14);
      --warn: #f0b23e;
      --warn-soft: rgba(240, 178, 62, 0.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 2.5rem;
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding-inline: 1.25rem; }

  .brand { display: flex; align-items: center; gap: .7rem; margin-bottom: .35rem; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(91,92,240,.55);
  }
  .brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
  .brand-sub { color: var(--muted); font-size: .85rem; }

  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin: .2rem 0 .1rem; }
  h2 {
    font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 2.4rem 0 .9rem; display: flex; align-items: center; gap: .55rem;
  }
  h2::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(145deg, var(--accent), var(--accent-2)); flex: none; }
  h3 { font-size: 1rem; font-weight: 700; margin: 1.6rem 0 .8rem; }
  p { color: var(--muted); }
  .muted { color: var(--muted-2); }
  code { background: var(--accent-soft); color: var(--accent); padding: .15rem .4rem; border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: .85em; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.4rem 1.5rem;
  }
  .card + .card { margin-top: 1rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; }
  .stat-tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    padding: 1rem 1.1rem; box-shadow: var(--shadow);
  }
  .stat-label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); }
  .stat-value { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; margin-top: .3rem; font-variant-numeric: tabular-nums; }
  .stat-value.good { color: var(--good); }
  .stat-value.bad { color: var(--bad); }

  .badge {
    display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; font-weight: 600;
    padding: .3rem .7rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .empty-note {
    border: 1px dashed var(--card-border); border-radius: 14px; padding: 1.1rem 1.3rem;
    color: var(--muted); font-size: .92rem; background: color-mix(in srgb, var(--card) 60%, transparent);
  }

  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { padding: .65rem .3rem; text-align: right; border-bottom: 1px solid var(--card-border); }
  th:first-child, td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
  thead th { text-align: right; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-2); font-weight: 700; border-bottom: 2px solid var(--card-border); }
  thead th:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-soft); }
  td.num, th.num { font-variant-numeric: tabular-nums; }

  .bar-track { position: relative; height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin-top: .3rem; }
  .bar-fill { position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .axis-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: .7rem; margin-bottom: 1.2rem; }
  .axis-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    box-shadow: var(--shadow); padding: .9rem 1rem; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--text); position: relative; overflow: hidden;
    transition: transform .12s ease, border-color .12s ease;
  }
  .axis-card:hover { transform: translateY(-2px); }
  .axis-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity: 0; transition: opacity .12s ease;
  }
  .axis-card.active { border-color: var(--accent); }
  .axis-card.active::before { opacity: 1; }
  .axis-card.unavailable { opacity: .55; }
  .axis-card-label { font-size: .72rem; font-weight: 600; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .axis-card-score { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin-top: .25rem; font-variant-numeric: tabular-nums; }
  .axis-card-sub { font-size: .7rem; color: var(--muted-2); margin-top: .15rem; }
  .axis-card.overall .axis-card-score { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .panel { animation: panel-in .15s ease; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .tile-rank-row { display: grid; grid-template-columns: 2.6rem 1fr 2.4rem; align-items: center; gap: .7rem; margin-bottom: .55rem; }
  .tile-rank-label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .9rem; }
  .tile-rank-count { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }

  .category-row { margin-bottom: 1.1rem; }
  .category-row:last-child { margin-bottom: 0; }
  .category-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; margin-bottom: .3rem; }
  .category-label { font-weight: 600; font-size: .9rem; }
  .category-count { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .category-desc { font-size: .8rem; margin: .35rem 0 0; }

  .insight-heading { margin: 0 0 .8rem; font-size: .74rem; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: .06em; }

  .filter-card form { display: flex; flex-wrap: wrap; gap: 1rem 1.2rem; align-items: flex-end; }
  .filter-field label { display: block; font-size: .72rem; font-weight: 600; color: var(--muted-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .35rem; }
  .filter-field input {
    padding: .55rem .7rem; border-radius: 9px; border: 1px solid var(--card-border);
    background: var(--bg); color: var(--text); font-family: "JetBrains Mono", monospace; font-size: .88rem;
    color-scheme: light dark;
  }
  .filter-field input[type=number] { width: 6.5rem; }
  .filter-card button {
    padding: .58rem 1.1rem; border-radius: 9px; border: none; cursor: pointer;
    background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; font-size: .88rem;
  }
  .filter-reset { font-size: .82rem; color: var(--muted); }
  .filter-summary { font-size: .8rem; margin: .8rem 0 0; }

  @media (max-width: 900px) {
    .axis-row { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 560px) {
    .axis-row { grid-template-columns: repeat(2, 1fr); }
  }

  .scroll-table { max-height: 360px; overflow-y: auto; border-radius: 12px; }

  .center-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .hero-card { width: 100%; max-width: 420px; text-align: center; }
  .hero-mark {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 1.1rem;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px -8px rgba(91,92,240,.55);
  }
  .hero-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .35rem; }
  .hero-sub { font-size: .9rem; color: var(--muted); margin-bottom: 1.4rem; }
  form.id-form { display: flex; gap: .5rem; }
  form.id-form input[type=text] {
    flex: 1; padding: .7rem .9rem; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--bg); color: var(--text); font-family: "JetBrains Mono", monospace; font-size: .95rem;
  }
  form.id-form input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  form.id-form button {
    padding: .7rem 1.2rem; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; font-size: .95rem;
    box-shadow: 0 8px 18px -8px rgba(91,92,240,.6);
  }
  form.id-form button:hover { filter: brightness(1.06); }
  .error-msg { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: .6rem .9rem; font-size: .88rem; margin-bottom: 1rem; }

  .quick-link {
    display: block; text-align: center; padding: .85rem 1.2rem; border-radius: 12px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: white;
    font-weight: 700; font-size: .95rem; box-shadow: 0 10px 22px -8px rgba(91,92,240,.55);
  }
  .quick-link:hover { filter: brightness(1.06); text-decoration: none; }

  .footer-link { margin-top: 2.2rem; text-align: center; }

  @media (max-width: 720px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
